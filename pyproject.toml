[project]
name = "global_signal_plots"
version = "0.1.0"
description = "Generic global-signal QA: per-scan global-signal metrics + PDF traces from any BIDS/derivatives BOLD."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "nibabel"]

[project.optional-dependencies]
plot = ["matplotlib"]

[project.scripts]
nf-global-signal = "global_signal_plots.cli:main"

[dependency-groups]
dev = ["pytest>=8", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/global_signal_plots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
